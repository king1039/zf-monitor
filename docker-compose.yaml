services:
  zf-monitor-back:
    image: ghcr.io/king1039/zf-monitor-back:latest
    container_name: zf-monitor-back
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      REDIS_ADDR: zf-monitor-redis:6379
      KAFKA_ADDR: kafka:9092
      KAFKA_TOPIC: stark.metrics.raw
      KAFKA_CONSUMER_GROUP: stark-monitor-metrics-v1
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-stark}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stark_monitor}}
    volumes:
      - /opt/zf-monitor-docker-data/backend:/app/data
    networks:
      - zf-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: zf-monitor-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stark_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-stark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/zf-monitor-docker-data/postgres:/var/lib/postgresql/data
    networks:
      - zf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zf-monitor-db-controller:
    image: ghcr.io/king1039/zf-monitor-db-controller:latest
    container_name: zf-monitor-db-controller
    volumes:
      - /etc/zf-monitor/db-controller.yaml:/app/config.yaml:ro
      - /opt/zf-monitor-docker-data/backend:/app/data
    networks:
      - zf-network
    restart: unless-stopped

  zf-monitor-redis:
    image: redis:7-alpine
    container_name: zf-monitor-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - /opt/zf-monitor-docker-data/redis:/data
    networks:
      - zf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    container_name: zf-monitor-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - /opt/zf-monitor-docker-data/kafka:/var/lib/kafka/data
    networks:
      - zf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: zf-monitor-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic stark.metrics.raw --partitions 6 --replication-factor 1
    networks:
      - zf-network
    restart: "no"

networks:
  zf-network:
    external: true
