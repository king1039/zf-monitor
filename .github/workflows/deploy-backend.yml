name: ZF Monitor Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'zf-monitor-back/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: zf-monitor-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 10

    steps:
      - name: Deploy backend
        shell: bash
        run: |
          set -e
          /opt/zf-monitor/deploy.sh
