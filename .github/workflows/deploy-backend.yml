name: ZF Monitor Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'zf-monitor-back/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: zf-monitor-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ZF_SERVER_HOST }}
          username: ${{ secrets.ZF_SERVER_USER }}
          key: ${{ secrets.ZF_SERVER_SSH_KEY }}
          script: |
            set -e

            echo "Starting ZF Monitor backend deployment..."
            echo "Pulling latest source..."
            cd /opt/zf-monitor
            git pull --ff-only origin main

            cd /opt/zf-monitor/zf-monitor-back

            echo "Downloading Go modules..."
            go mod download

            echo "Building backend..."
            go build -o zf-monitor-back.new .

            echo "Replacing backend binary..."
            mv zf-monitor-back.new zf-monitor-back
            chmod +x zf-monitor-back

            echo "Restarting systemd service..."
            systemctl restart zf-monitor-back
            systemctl is-active --quiet zf-monitor-back

            sleep 2

            echo "Checking backend health..."
            curl -f http://127.0.0.1:8080/api/hosts > /dev/null

            echo "ZF Monitor backend deployment successful."
